# guild eval — the harness's reference VENTURE build (the studio itself, end to end).
# A two-founder Philippine engineering studio with build capability (forge = software, anvil =
# hardware), business permit in progress, no customer yet. Every gate exercisable. The segment
# below is the beachhead HYPOTHESIS the founders start discovery with — `segment.elected` is a
# human sign-off row that /guild:discover fills after the interview quota is met; the spec is
# re-validated then. Generated by hand 2026-09-02 as the exemplar; a real run regenerates it.
name: studio
summary: Metro Manila product/engineering studio (software + hardware) selling paid discovery → fixed-scope builds → retainers, starting with inventory-count automation for SMB manufacturers
thesis: "SMB manufacturers in Metro Manila with manual inventory counts will pay for a scoped automation build plus a support retainer because manual counts cost them >= 8 h/week and stockouts, and no local studio sells that outcome as a packaged offer"
founders: 2
capabilities: [software, hardware]
region: PH-NCR

segment:                      # ICP election — charter-level early irreversible (dossier §6 #4)
  icp: "SMB manufacturers, Metro Manila, 20–200 employees, manual or spreadsheet inventory, owner-operated, private buyers (no PhilGEPS)"
  anti_icp: "enterprises with an existing ERP/WMS; government procurement; single-location shops under 10 staff"
  market_type: resegmented_niche   # existing budget (counts, audits) served by a niche offer — 12–18-month cash horizon, not a new market
  elected: pending-discovery       # human sign-off after >= 12 consented interviews + >= 3 money-class commitments
  evidence: discovery/segments.csv

targets:
  first_customer_by: 2026-12-31
  gross_margin: { min: 0.35, corner: worst }        # services floor (SPI project margin 35.9 %)
  runway_months: { min: 6 }
  cash_buffer_days: { min: 27 }                       # JPMC median
  interviews: { min: 12, per_segment: 12, evidence_grade_min: 0.50 }
  wtp_interviews: { min: 10 }
  pipeline_coverage: { min: 5.0 }                     # 1 ÷ win-rate at ~20 % until 20 outcomes

acceptance:
  evidence:
    - { id: EV-1, assert: "sources.tsv VALID and claims.tsv VALID; every source archived + hashed; no CAPTCHA fetch", weight: 2, traces: V-1, gate: true }
    - { id: EV-2, assert: "UNSOURCED_CLAIMS == 0 on charter, market, offer, pricing, economics and board documents", weight: 2, traces: V-1, gate: true }
    - { id: EV-3, assert: "interview ledger 100 % consent-joined; SPI rows explicit; no row past deletion_due", weight: 1, traces: V-2 }
  customer:
    - { id: CU-1, assert: ">= 12 consented interviews in the elected segment with >= 50 % evidence-grade rows and no pitch in the first six", weight: 2, traces: V-2, gate: true }
    - { id: CU-2, assert: "every ICP leaf traces to >= 3 interview ids; four forces and five beachhead criteria populated; >= 3 anti-ICP disqualifiers", weight: 1, traces: V-2 }
    - { id: CU-3, assert: "VRS_MEASURABLE = all rows; >= 3 money-class commitments (LOI / paid pilot / deposit) from the elected segment", weight: 2, traces: V-3, gate: true }
    - { id: CU-4, assert: "segment + market-type election recorded as a human sign-off row", weight: 1, traces: V-3 }
  offer:
    - { id: OF-1, assert: "POSITIONING_VIOLATIONS == 0 (six slots resolve to ledger ids; <= 75 words; no banned adjectives)", weight: 1, traces: V-4 }
    - { id: OF-2, assert: "OFFER_VIOLATIONS == 0 (one paid-discovery offer; tiers with fences; capped guarantee; ex-VAT/EWT tax note)", weight: 1, traces: V-4 }
    - { id: OF-3, assert: "PRICE_VIOLATIONS == 0 (list >= floor/(1-GM) at <= 75 % utilisation; competitor band <= 90 d; >= 10 WTP rows; VAT/8 %/CWT consistent)", weight: 2, traces: V-5 }
    - { id: OF-4, assert: "pitch tests over >= 8 ICP conversations: confusion <= 25 %, next step >= 50 %", weight: 1, traces: V-4 }
  economics:
    - { id: EC-1, assert: "ECON_PASS = all assertions at base AND worst corners (GM >= 35 % services / >= 50 % hardware direct, LTV/CAC >= 3 base, payback <= 12 mo SMB)", weight: 2, traces: V-6, gate: true }
    - { id: EC-2, assert: "CASH_PASS = all: 13-week forecast never below floor, receipts variance <= 15 %, reserve >= 3 months fixed opex, cash-buffer days >= 27", weight: 2, traces: V-6, gate: true }
    - { id: EC-3, assert: "DEFAULT_ALIVE = 1 from month 6 of revenue, or an accepted fatal-pinch ADR", weight: 1, traces: V-6 }
    - { id: EC-4, assert: "STUDIO_PASS = all (utilisation >= 65 %, realisation >= 90 %, concentration <= 25 %, DSO <= 45, deposit >= 20 %)", weight: 1, traces: V-7 }
    - { id: EC-5, assert: "COGS driver rows for hardware lines cite anvil PRODUCT_COST/BOM_COST; software lines cite forge build effort", weight: 1, traces: V-6 }
  gtm:
    - { id: GT-1, assert: "FUNNEL_VIOLATIONS == 0 (dated next steps, no stale/slipped commits, stage exits, coverage >= 1/win-rate x 1.2)", weight: 1, traces: V-8 }
    - { id: GT-2, assert: "EXPERIMENT_VIOLATIONS == 0 (pre-registered, n + duration before WIN/LOSE, confidence needs evidence, spend approved)", weight: 1, traces: V-9 }
    - { id: GT-3, assert: "ASSET_LINT == 0 on one-pager, landing page, pricing page, case study, email sequence", weight: 1, traces: V-9 }
    - { id: GT-4, assert: "CONSENT_VIOLATIONS == 0 (every send human-approved and joined to a live opt-in)", weight: 1, traces: V-9 }
  operations:
    - { id: OP-1, assert: "SOW_MISSING == 0 on the SOW template (payments on milestone ids, deemed acceptance, change control, IP, warranty floors)", weight: 1, traces: V-10 }
    - { id: OP-2, assert: "DELIVERY_VIOLATIONS == 0 and SHIP_BLOCKERS == 0 (NTC/BPS where applicable)", weight: 1, traces: V-10 }
    - { id: OP-3, assert: "AR_VIOLATIONS == 0 (credit term printed, 2307 collected, short payments classified)", weight: 1, traces: V-11 }
    - { id: OP-4, assert: "COMPLIANCE = all applicable rows done on time; professional sign-off rows signed by a named human", weight: 1, traces: V-11 }
  governance:
    - { id: GO-1, assert: "FOUNDERS_AGREEMENT VALID before any external money", weight: 1, traces: V-12 }
    - { id: GO-2, assert: "BOARD_PACK OK (derived from ledgers <= 31 days old, 48 h pre-read) and GOVERNANCE_VIOLATIONS == 0", weight: 1, traces: V-12 }
    - { id: GO-3, assert: "kill/pivot rows K1–K7 pre-committed with numeric thresholds and decide-by dates; verdict CONTINUE at the first board", weight: 1, traces: V-12 }

# Post-build acceptance beyond the metric: FIRST_CUSTOMER = a `won` row in gtm/pipeline.tsv with an
# invoice id and payment = evidence:<path>, entered by a human — never by the loop.
